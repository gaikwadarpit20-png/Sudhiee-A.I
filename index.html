      
  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudhiee A.I 6.0</title>

<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#000;
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* PARTICLES */
#particles-js{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* SIDEBAR */
#sidebar{
  width:80px;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
  border-right:1px solid #222;
}

#avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  background:radial-gradient(circle,#ff6ec4,#7873f5);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 0 20px #ff6ec4;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 10px #ff6ec4;}
  to{box-shadow:0 0 25px #7873f5;}
}

#clearBtn{
  margin-top:20px;
  font-size:12px;
  cursor:pointer;
  color:#ff6ec4;
}

/* MAIN */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

header{
  padding:15px;
  text-align:center;
  font-size:18px;
  background:#0f0f0f;
  border-bottom:1px solid #222;
}

.mood{
  text-align:center;
  padding:5px;
  background:#111;
}

button{
  padding:6px 10px;
  border:none;
  border-radius:15px;
  margin:2px;
  background:#ff6ec4;
  color:white;
  font-size:12px;
}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
}

.message{
  margin:8px 0;
  padding:10px 14px;
  border-radius:15px;
  max-width:75%;
  animation:fadeIn .3s ease;
}

.user{
  background:#ff6ec4;
  align-self:flex-end;
}

.bot{
  background:#222;
  align-self:flex-start;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

#inputArea{
  display:flex;
  padding:10px;
  background:#111;
}

input{
  flex:1;
  padding:10px;
  border:none;
  border-radius:20px;
  outline:none;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div id="sidebar">
  <div id="avatar">🤖</div>
  <div id="clearBtn" onclick="clearChat()">Clear</div>
</div>

<div id="main">
<header>Sudhiee A.I ⚡ God 6.0</header>

<div class="mood">
<button onclick="changeMood('sweet')">Sweet 💕</button>
<button onclick="changeMood('savage')">Savage 😈</button>
<button onclick="changeMood('professional')">Pro 🤖</button>
</div>

<div id="chat"></div>

<div id="inputArea">
<input type="text" id="userInput" placeholder="Talk to me...">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<script>
const API_URL="https://your-vercel-app.vercel.app/api/chat";

let memory=JSON.parse(localStorage.getItem("memory"))||[];
let mood="sweet";

function changeMood(newMood){
  mood=newMood;
  alert("Mood: "+newMood);
}

function clearChat(){
  memory=[];
  localStorage.removeItem("memory");
  document.getElementById("chat").innerHTML="";
}

function addMessage(text,type){
  let chat=document.getElementById("chat");
  let msg=document.createElement("div");
  msg.classList.add("message",type);
  msg.innerText=text;
  chat.appendChild(msg);
  chat.scrollTop=chat.scrollHeight;
}

async function sendMessage(){
  let input=document.getElementById("userInput");
  let text=input.value.trim();
  if(text==="") return;

  addMessage(text,"user");
  memory.push({role:"user",content:text});
  if(memory.length>10) memory.shift();
  localStorage.setItem("memory",JSON.stringify(memory));
  input.value="";

  let typing=document.createElement("div");
  typing.classList.add("message","bot");
  typing.innerHTML="Typing<span id='dots'>.</span>";
  document.getElementById("chat").appendChild(typing);

  let dots=document.getElementById("dots");
  let count=1;
  let interval=setInterval(()=>{
    count=(count%3)+1;
    dots.innerText=".".repeat(count);
  },400);

  const response=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,memory:memory,mood:mood})
  });

  const data=await response.json();

  clearInterval(interval);
  typing.remove();

  addMessage(data.reply,"bot");
  memory.push({role:"assistant",content:data.reply});
  if(memory.length>10) memory.shift();
  localStorage.setItem("memory",JSON.stringify(memory));

  speak(data.reply);
}

function speak(text){
  let speech=new SpeechSynthesisUtterance(text);
  speech.rate=1;
  speech.pitch=1.1;
  window.speechSynthesis.speak(speech);
}

tsParticles.load("particles-js",{
  particles:{
    number:{value:60},
    color:{value:"#ffffff"},
    links:{enable:true,color:"#ffffff"},
    move:{enable:true,speed:2}
  }
});
</script>

</body>
</html>
